# Manual Apple Silicon release. This does not run on pull requests.
# Tauri exits 0 when the Apple secrets are missing, so this job refuses
# to start without them. It also notarizes and staples the DMG itself.
# A green test CI run is not this workflow and is not a notarized release.
name: Release macOS

on:
  workflow_dispatch:

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Refuse to continue without signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Notarization was not performed. This workflow will not report success."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the App Store Connect API key without printing it
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8"

      - run: bash packaging/build-sidecar.sh
      - run: npm ci
        working-directory: frontend
      - name: Build and sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: frontend/node_modules/.bin/tauri build --bundles dmg

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/release/bundle/macos -name '*.app' -maxdepth 1 | head -n 1)"
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -maxdepth 1 | head -n 1)"
          test -n "$app"
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          authority="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
          echo "$authority" | grep -q "Authority=Developer ID Application"
          echo "$authority" | grep -q "TeamIdentifier="
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$app"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: DocxEditor-macos-notarized
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
