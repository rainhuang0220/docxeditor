[package]
name = "app"
version = "0.1.0"
description = "DocxEditor desktop shell"
authors = []
license = "Apache-2.0"
repository = "https://github.com/rainhuang0220/docxeditor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "multipart", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
